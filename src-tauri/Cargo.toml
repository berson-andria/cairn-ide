[package]
name = "cairn"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cairn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.3"
uuid = { version = "1.26.1", features = ["v4", "serde"] } 
tauri-plugin-fs = { version = "2.5.2", features = ["watch"] }
walkdir = "2.5.0"
rayon = "1.12.0"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
ignore = "0.4.33"
tauri-plugin-shell = "2"
tokio = { version = "1.53.2", features = ["process", "rt-multi-thread", "macros", "io-util", "sync"] }
lazy_static = "1.5.1"
portable-pty = "0.9.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
debug = 1 # Reduces debug info from full (2) to line-tables only (1). Saves massive space.

[profile.dev.package."*"]
opt-level = 3
