<div class="container">
  <div class="input-form-container">
    <textarea
      name="message"
      id="message-content"
      autoExpand
      rows="1"
      autocomplete="off"
      placeholder="Describe what to build"
      style="color: white"
      [formControl]="queryController"
      (submit)="sendQuery()"
    ></textarea>
  </div>
  <div class="btn-group">
    <button><ng-icon name="lucidePlus"></ng-icon></button>

    <div>
      <button>
        <ng-icon name="lucideMic"></ng-icon>
      </button>
      <button type="submit" (click)="sendQuery()" [disabled]="!queryController.valid">
        <ng-icon name="lucideArrowUp"></ng-icon>
      </button>
    </div>
  </div>
</div>
