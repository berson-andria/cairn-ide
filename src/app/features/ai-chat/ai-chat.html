<div class="container">
  <div class="header">
    <div class="btn-group">
      <button style="display: inline-flex; flex-direction: row; align-items: center">
        <ng-icon name="lucidePlus "></ng-icon>
        <span style="margin-left: 0.25em">chat</span>
      </button>
      <div>
        <button class="square"><ng-icon name="lucideHistory "></ng-icon></button>
        <button class="square"><ng-icon name="lucideSettings "></ng-icon></button>
        <button class="square"><ng-icon name="lucideMaximize "></ng-icon></button>
        <button
          class="square"
          style="margin-left: 0.75em"
          (click)="layoutService.toggleSecondarySideBar()"
        >
          <ng-icon name="lucideX "></ng-icon>
        </button>
      </div>
    </div>
  </div>
  <div class="chat"></div>
  <message-input></message-input>
</div>
