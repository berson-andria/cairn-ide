<div class="notes">
  <header class="notes__header">
    <span>Notes</span>
    <button type="button" class="icon-button" aria-label="Add note" title="Add note" (click)="addNote()">+</button>
  </header>

  <main class="notes__main">
    @for (note of notes(); track note.id) {
      <article class="note">
        <button type="button" class="note__open" (click)="openNote(note)"
          [attr.aria-label]="'Open note ' + (note.title || 'Untitled note')">
          <h3 class="note__title">{{ note.title || 'Untitled note' }}</h3>
          <div class="note__meta">
            <span class="note__scope">{{ note.scope === 'project' ? 'Project' : 'Global' }}</span>
            <time [attr.datetime]="note.createdAt.toISOString()">{{ note.createdAt | date:'mediumDate' }}</time>
          </div>
          @if (note.content) {
            <p class="note__content">{{ note.content }}</p>
          }
          @if (note.files.length > 0) {
            <div class="note__files">
              @for (file of note.files; track file.path) {
                <span class="note__file-chip" [title]="file.path">{{ file.fileName }}</span>
              }
            </div>
          }
        </button>
        <button type="button" class="note__delete" aria-label="Delete note" title="Delete note"
          (click)="deleteNote(note, $event)">×</button>
      </article>
    } @empty {
      <div class="notes__empty">
        <p>No notes yet</p>
        <span>Create a note to keep useful context close to your project.</span>
      </div>
    }
  </main>

  <footer class="notes__footer">
    <button type="button" class="add-note-button" (click)="addNote()"><span>+</span> Add note</button>
  </footer>
</div>
