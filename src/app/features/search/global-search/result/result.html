<div class="container">
  <div class="file" [class.is-open]="open" (click)="open = !open">
    <div class="details">
      <span class="accordion">
        @if (open) {
          <ng-icon name="bootstrapChevronDown" />
        } @else {
          <ng-icon name="bootstrapChevronRight" />
        }
      </span>
      <img [src]="getIconPath()" class="node-icon" alt="file-icon" />
      <span class="filename">{{ fileName() }}</span>
      <span class="path">
        {{ path() }}
      </span>
    </div>
    <span class="actions">
      @if (replaceMode() && pattern()) {
        <button class="replace-btn" title="Replace in this file" (click)="onReplaceFile($event)">
          <ng-icon name="lucideReplaceAll" />
        </button>
      }
      <span class="count">{{ result().matches.length }}</span>
    </span>
  </div>
  @if (open) {
    @for (line of result().matches; track line.lineNumber) {
      <div class="lines" (click)="openFile(line.lineNumber)">
        <span class="line-number">{{ line.lineNumber }}</span>
        @if (replaceMode() && pattern()) {
          <span
            class="text"
            [innerHTML]="line.text | replacePreview: pattern() : replacement()"
          ></span>
          <button
            class="replace-btn"
            title="Replace this match"
            (click)="onReplaceLine($event, line)"
          >
            <ng-icon name="lucideReplace" />
          </button>
        } @else {
          <span class="text" [innerHTML]="line.text | searchSnippet: keyword()"></span>
        }
      </div>
    }
  }
</div>
