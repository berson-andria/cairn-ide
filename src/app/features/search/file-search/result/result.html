<div class="container">
  <div class="files" (click)="openFile()">
    <div class="file">
      <img
        [src]="'assets/node-icons/' + getIconName() + '.svg'"
        class="node-icon"
        alt="file-icon"
      />
      <span class="filename">{{ result().fileName }}</span>
    </div>
    <span class="path">
      {{ path() }}
    </span>
  </div>
</div>
