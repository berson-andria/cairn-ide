<div
  class="node-row file"
  [ngStyle]="indentStyle()"
  [ngClass]="{ 'is-active': isActive(), 'is-selected': isSelected(), 'is-cut': isCut() }"
  [nodeDnd]="nodeId()"
  (click)="onClick($event)"
  (dblclick)="onDoubleClick()"
>
  <span class="accordion"></span>
  <span>
    <img [src]="iconName()" class="node-icon" alt="file-icon" />
  </span>
  @if (isRenaming()) {
    <rename-node [nodeId]="nodeId()" />
  } @else {
    <span class="node-name">{{ nodeStore.nodes()[nodeId()].name }}</span>
  }
</div>
