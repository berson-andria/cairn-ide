<!--
  data-tauri-drag-region does not cascade: it is set on the bar and on each
  non-interactive zone/text. Buttons do not carry it, so they stay clickable.
-->
<header class="title-bar" data-tauri-drag-region>
  <div class="title-bar__start" data-tauri-drag-region>
    <img src="assets/icon.png" alt="" width="24px" />
    <button
      class="title-bar__menu"
      type="button"
      aria-label="Cairn menu"
      [appMenu]="main_menu"
      [menuPosition]="['left', 'bottom']"
    >
      <ng-icon name="lucideFolderRoot " style="font-size: 14px" />
      <span>{{ project() }}</span>
      <ng-icon name="lucideChevronDown" />
    </button>
    <ng-template #main_menu>
      <div class="menu actions-menu" role="menu">
        <div class="menu-item-group">
          <button class="menu-item" role="menuitem">
            New Windows <span class="chip">Ctrl + Shift + N</span>
          </button>
          <button class="menu-item" role="menuitem">
            New Task <span class="chip">Ctrl + Alt + T</span>
          </button>
          <button class="menu-item" role="menuitem">
            New Note <span class="chip">Ctrl + Alt + N</span>
          </button>
        </div>
        <div class="menu-item-group">
          <button class="menu-item" role="menuitem" (click)="commands.openFolder()">
            Open Folder... <span class="chip">Ctrl + Shift + O</span>
          </button>
          <button class="menu-item" role="menuitem" (click)="openFile()">
            Open File... <span class="chip">Ctrl + O</span>
          </button>
          <button
            class="menu-item menu-accordion-btn"
            [appMenu]="history"
            [menuPosition]="['right', 'center']"
            [disabled]="true"
          >
            <span>Open Recent</span> <ng-icon name="lucideChevronRight" />
          </button>
          <ng-template #history>
            <div class="menu">
              <div class="menu-item-group">
                <!-- <button class="menu-item" role="menuitem">Commit</button>
                <button class="menu-item" role="menuitem">Commit Staged</button>
                <button class="menu-item" role="menuitem">Commit All</button> -->
              </div>
            </div>
          </ng-template>
        </div>
        <div class="menu-item-group">
          <button class="menu-item" role="menuitem" (click)="saveFile()">
            Save <span class="chip">Ctrl + S</span>
          </button>
          <button class="menu-item" role="menuitem">
            Save All<span class="chip">Ctrl + Alt + S</span>
          </button>
          <button class="menu-item" role="menuitem">
            Save As... <span class="chip">Ctrl + Shift + S</span>
          </button>
        </div>
        <div class="menu-item-group">
          <button class="menu-item" role="menuitem">Close Folder</button>
          <button class="menu-item" role="menuitem">
            Setting <span class="chip" (click)="layoutService.openSettingDialog()">Ctrl + ,</span>
          </button>
          <button class="menu-item" role="menuitem" (click)="close()">Exit</button>
        </div>
      </div>
    </ng-template>

    <button class="icon-btn" type="button" aria-label="Back">
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M10 3L5 8l5 5" />
      </svg>
    </button>
    <button class="icon-btn" type="button" aria-label="Forward" disabled>
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M6 3l5 5-5 5" />
      </svg>
    </button>
  </div>

  <button
    class="title-bar__search"
    type="button"
    aria-label="Search"
    (click)="layoutService.openSearchDialog()"
  >
    <span>Search files, text, tasks, symbols</span>
    <span class="chip">Ctrl + P</span>
  </button>

  <div class="title-bar__end" data-tauri-drag-region>
    <button class="title-bar__action" type="button" aria-label="New chat">
      <svg
        width="14"
        height="14"
        viewBox="0 0 14 14"
        fill="none"
        stroke="currentColor"
        stroke-width="1.3"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M2 3h10v7H6l-3 2.5V10H2z" />
      </svg>
      + Chat
    </button>
    <button class="title-bar__chats" type="button" aria-label="Chat list">Chats ▾</button>

    <button class="icon-btn" type="button" aria-label="Settings">
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M2 4h12M2 8h12M2 12h12" />
        <circle class="title-bar__knob" cx="10" cy="4" r="1.6" />
        <circle class="title-bar__knob" cx="5" cy="8" r="1.6" />
        <circle class="title-bar__knob" cx="11" cy="12" r="1.6" />
      </svg>
    </button>

    <div class="title-bar__window-controls">
      <button
        class="title-bar__window-control"
        type="button"
        aria-label="Minimize"
        (click)="minimize()"
      >
        <svg
          width="10"
          height="10"
          viewBox="0 0 10 10"
          stroke="currentColor"
          stroke-width="1.2"
          fill="none"
          aria-hidden="true"
        >
          <path d="M0 5h10" />
        </svg>
      </button>
      <button
        class="title-bar__window-control"
        type="button"
        aria-label="Maximize"
        (click)="toggleMaximize()"
      >
        <svg
          width="10"
          height="10"
          viewBox="0 0 10 10"
          stroke="currentColor"
          stroke-width="1.2"
          fill="none"
          aria-hidden="true"
        >
          <rect x=".6" y=".6" width="8.8" height="8.8" />
        </svg>
      </button>
      <button class="title-bar__window-control" type="button" aria-label="Close" (click)="close()">
        <svg
          width="10"
          height="10"
          viewBox="0 0 10 10"
          stroke="currentColor"
          stroke-width="1.2"
          fill="none"
          aria-hidden="true"
        >
          <path d="M0 0l10 10M10 0L0 10" />
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="app-shell__body">
  <left-panel />
  <main-panel />
</div>

<footer class="status-bar">
  <div class="status-bar__group">
    <div class="git-btn-group">
      <button
        class="status-bar__item status-bar__item--strong"
        [class.is-active]="layoutService.isGitChangeDisplayed()"
        type="button"
        aria-label="Toggle Git Changes"
        title="Toggle Git Changes"
        [class.notif]="gitChangesCount() > 0"
        (click)="layoutService.toggleGitChange()"
      >
        <ng-icon name="lucideGitCommitHorizontal" />
        @if (gitChangesCount() > 0) {
          <span>{{ gitChangesCount() }}</span>
        }
        <span>Changes</span>
      </button>
      <button
        class="status-bar__item status-bar__item--strong"
        type="button"
        aria-label="Switch Branch"
        title="Switch Branch"
        (click)="layoutService.openGitBranch()"
      >
        <ng-icon name="lucideGitBranch " />
        <span>{{ currentBranch() }}</span>
      </button>
      @if (needsPublish()) {
        <button
          class="icon-btn notif"
          title="Publish branch"
          aria-label="Publish branch"
          (click)="publishBranch()"
        >
          <ng-icon name="lucideCloudUpload" />
        </button>
      }
      @if (git.status() && (git.status()!.ahead || git.status()!.behind)) {
        <button
          class="icon-btn notif"
          title="Sync changes"
          aria-label="Sync changes"
          [disabled]="!git.status()?.upstream"
          (click)="gitClient.sync()"
        >
          <ng-icon name="lucideRefreshCcw" />
          <span class="hint" style="margin-left: var(--space-6)">
            {{ git.status()!.behind }}↓ {{ git.status()!.ahead }}↑
          </span>
        </button>
      }
      <button
        class="status-bar__item status-bar__item--strong"
        type="button"
        aria-label="Open Git Graph"
        title="Open Git Graph"
        (click)="toggleToolkit('Git')"
      >
        <ng-icon name="lucideGitGraph" />
        <span>Graph</span>
      </button>
    </div>

    <button
      class="status-bar_item status-bar__item--strong"
      style="display: flex; align-items: center; gap: var(--space-6)"
      type="button"
      aria-label="Toggle Issues"
      (click)="toggleToolkit('Problems')"
    >
      <ng-icon name="lucideOctagonX " />
      <span class="count">{{ counts().error }}</span>
      <ng-icon name="lucideAlertTriangle " />
      <span class="count"> {{ counts().warning }}</span>
    </button>
  </div>

  <div class="status-bar__group">
    @if (monitoring.editorData()) {
      <button class="status-bar__item status-bar__item--strong">
        Ln {{ cursorPosition().line }}, Col
        {{ cursorPosition().col }}
      </button>
      <button class="status-bar__item status-bar__item--strong">
        <ng-icon name="lucideBraces " />
        <span>{{ monitoring.editorData()?.language | titlecase }}</span>
      </button>
    }
  </div>
</footer>
