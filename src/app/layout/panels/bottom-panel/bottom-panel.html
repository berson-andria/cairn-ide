<app-resize-handle
  axis="y"
  edge="start"
  [min]="minHeight"
  [max]="maxHeight"
  (sizeChange)="height.set($event)"
/>
<div
  style="
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 16px;
    height: 34px;
    border-bottom: 1px solid #2e2a24;
    font-size: 12px;
  "
>
  <button
    class="tab"
    [class.tab--active]="layoutService.isToolkitActive('Terminal')"
    (click)="layoutService.toggleToolkit('Terminal')"
  >
    Terminal
  </button>
  <button
    class="tab"
    [class.tab--active]="layoutService.isToolkitActive('Git')"
    (click)="layoutService.toggleToolkit('Git')"
  >
    Git
  </button>
  <button
    class="tab"
    [class.tab--active]="layoutService.isToolkitActive('Problems')"
    (click)="layoutService.toggleToolkit('Problems')"
  >
    Problems 3
  </button>
  <button
    class="tab"
    [class.tab--active]="layoutService.isToolkitActive('Log')"
    (click)="layoutService.toggleToolkit('Log')"
  >
    Logs
  </button>
  @if (layoutService.isToolkitActive('Git')) {
    <div
      style="
        margin-left: auto;
        display: flex;
        background: #1c1a17;
        border-radius: 6px;
        padding: 2px;
      "
    >
      <button style="background: #2e2a24; color: #e8e2d6; padding: 2px 10px; border-radius: 4px">
        Flat</button
      ><button style="padding: 2px 10px">Graph</button>
    </div>
  }
</div>
@switch (layoutService.activeToolkit()) {
  @case ('Terminal') {
    <p>Terminal</p>
  }
  @case ('Git') {
    <p>Git</p>
  }
  @case ('Problems') {
    <p>Problems</p>
  }
  @case ('Log') {
    <p>Log</p>
  }
}
