<app-resize-handle
  axis="y"
  edge="start"
  [min]="minHeight"
  [max]="maxHeight"
  (sizeChange)="height.set($event)"
/>
<div
  style="
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 var(--space-8);
    height: 34px;
    border-bottom: 1px solid #2e2a24;
  "
>
  <button
    class="tab"
    [class.tab--active]="layoutService.isToolkitActive('Terminal')"
    (click)="layoutService.toggleToolkit('Terminal')"
  >
    Terminal
  </button>
  <button
    class="tab"
    [class.tab--active]="layoutService.isToolkitActive('Git')"
    (click)="layoutService.toggleToolkit('Git')"
  >
    Git
  </button>
  <button
    class="tab"
    [class.tab--active]="layoutService.isToolkitActive('Problems')"
    (click)="layoutService.toggleToolkit('Problems')"
  >
    Problems
  </button>
  <button
    class="tab"
    [class.tab--active]="layoutService.isToolkitActive('Log')"
    (click)="layoutService.toggleToolkit('Log')"
  >
    Log
  </button>
  <div style="margin-left: auto; display: flex; flex-direction: row">
    @if (layoutService.isToolkitActive('Terminal')) {
      <button class="icon-btn" (click)="createNewSession()" title="New terminal session">
        <ng-icon name="lucidePlus" />
        <span style="margin-left: 0.25em">New Session</span>
      </button>
    }
    @if (layoutService.isToolkitActive('Git')) {
      <div style="display: flex; background: #1c1a17; border-radius: 6px; padding: 2px">
        <button
          style="background: #2e2a24; color: #e8e2d6; padding: 2px 10px; border-radius: 4px"
          (click)="activeGitView = 'Changes'"
        >
          Changes</button
        ><button style="padding: 2px 10px" (click)="activeGitView = 'Graph'">Graph</button>
      </div>
    }
    <button class="icon-btn" style="margin-left: 2em" (click)="layoutService.toggleBottomPanel()">
      <ng-icon name="lucideMinus" />
    </button>
  </div>
</div>
@switch (layoutService.activeToolkit()) {
  @case ('Terminal') {
    <app-terminal />
    <!-- @if (tooling.terminalError(); as error) {
      @if (terminals.sessions().length === 0) {
        <div class="error" role="alert">
          <p>Could not start a shell.</p>
          <code>{{ error }}</code>
          <button type="button" (click)="tooling.newTerminal()">Retry</button>
        </div>
      }
    } -->
  }
  @case ('Git') {
    <app-git [activeView]="activeGitView"></app-git>
  }
  @case ('Problems') {
    <!-- Placeholder for Problems panel -->
    <div style="padding: 16px; color: #7f848e">Problems panel placeholder</div>
  }
  @case ('Log') {
    <!-- Placeholder for Log panel -->
    <div style="padding: 16px; color: #7f848e">Log panel placeholder</div>
  }
}
