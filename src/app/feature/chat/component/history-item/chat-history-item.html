<div class="history-item" [class.history-item--active]="isActive()">
  @if (renaming()) {
    <input
      class="history-item__rename"
      aria-label="Chat title"
      [value]="draftTitle()"
      (input)="draftTitle.set($any($event.target).value)"
      (keydown.enter)="saveRename()"
      (keydown.escape)="cancelRename()"
      (blur)="saveRename()"
    />
  } @else {
    <button class="history-item__open" type="button" role="menuitem" (click)="openChat()">
      <span>{{ chat().title ?? 'New chat' }}</span>
    </button>
  }

  <div class="history-item__actions" aria-label="Chat actions">
    <button
      class="history-item__action"
      type="button"
      title="Rename chat"
      aria-label="Rename chat"
      (click)="beginRename()"
    >
      <ng-icon name="lucidePencil" />
    </button>
    <button
      class="history-item__action"
      type="button"
      title="Create a fork"
      aria-label="Create a fork"
      (click)="forkChat()"
    >
      <ng-icon name="lucideGitFork" />
    </button>
    <button
      class="history-item__action history-item__action--danger"
      type="button"
      title="Delete chat"
      aria-label="Delete chat"
      (click)="deleteChat()"
    >
      <ng-icon name="lucideTrash2" />
    </button>
  </div>
</div>
