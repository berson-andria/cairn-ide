<div class="history-item" [class.history-item--active]="isActive()">
  @if (renaming()) {
    <input
      class="history-item__rename"
      aria-label="Chat title"
      [value]="draftTitle()"
      (input)="draftTitle.set($any($event.target).value)"
      (keydown.enter)="saveRename()"
      (keydown.escape)="cancelRename()"
      (blur)="saveRename()"
    />
  } @else {
    <button class="history-item__open" type="button" role="menuitem" (click)="openChat()">
      <span>{{ chat().title ?? 'New chat' }}</span>
    </button>
  }

  <button
    class="history-item__more"
    type="button"
    aria-label="Chat actions"
    title="Chat actions"
    [class.is-visible]="menuOpen()"
    [appMenu]="actions"
    [menuPosition]="['right', 'bottom']"
    #itemMenu="appMenu"
    (opened)="menuOpen.set(true)"
    (closed)="menuOpen.set(false)"
  >
    <ng-icon name="lucideEllipsis" />
  </button>

  <ng-template #actions>
    <div class="menu actions-menu" role="menu">
      <div class="menu-item-group">
        <button class="menu-item" type="button" (click)="beginRename(); itemMenu.close()">
          <ng-icon name="lucidePencil" />
          <span>Rename</span>
        </button>
        <button class="menu-item" type="button" (click)="forkChat(); itemMenu.close()">
          <ng-icon name="lucideGitFork" />
          <span>Create a Fork</span>
        </button>
        <button
          class="menu-item menu-btn-danger"
          type="button"
          (click)="deleteChat(); itemMenu.close()"
        >
          <ng-icon name="lucideTrash2" />
          <span>Delete</span>
        </button>
      </div>
    </div>
  </ng-template>
</div>
