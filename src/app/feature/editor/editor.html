<div class="container">
  <div class="path">
    @for (p of filePath(); track $index) {
      <span style="display: flex; align-items: center">
        {{ p }} >
      </span>
    }
  </div>
  <div class="file-content">
    <div class="pane" [class.hidden]="activeKind() === 'diff'">
      <app-code-editor></app-code-editor>
    </div>
    @if (hasDiffTabs()) {
      <div class="pane" [class.hidden]="activeKind() !== 'diff'">
        <diff-editor></diff-editor>
      </div>
    }
  </div>
</div>
