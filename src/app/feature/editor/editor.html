<div class="container">
  @if (filePath().length > 0) {
    <div class="path">
      @for (p of filePath(); track $index) {
        <span style="display: flex; align-items: center">
          @if ($last; as tab) {
            <file-icon [name]="name()" [type]="'file'" />
          }
          {{ p }} >
        </span>
      }
    </div>
  }
  <div class="file-content">
    <div class="pane" [class.hidden]="activeKind() !== 'CodeEditor'">
      <code-editor></code-editor>
    </div>
    @if (hasDiffTabs()) {
      <div class="pane" [class.hidden]="activeKind() !== 'DiffEditor'">
        <diff-editor></diff-editor>
      </div>
    }
  </div>
</div>
